<script>
	const compass = L.imageOverlay("CompassImage.png", [[100, 100],[-100, -100]])
	const map = L.map('map', {
		crs: L.CRS.Simple,
		minZoom: 1,
		maxZoom: 14,
    	zoomSnap: 0.5,
		zoomDelta: 0.5,
		wheelPxPerZoomLevel: 90,
		layers: [compass]
	}).setView([0, 0],1);

    const baseLayers = {
        "OpenStreetMap": osm,
        "OpenStreetMap.HOT": osmHOT,
        "OpenTopoMap": openTopoMap,
        "Esri": esri
    };
    const overlays = {
    };

    const layerControl = L.control.layers(baseLayers, overlays).addTo(map);

	L.control.scale().addTo(map);
	const Coordinates = L.Control.extend({
    onAdd: map => {
		const container = L.DomUtil.create("div");
		map.addEventListener("mousemove", e => {
			container.innerHTML = `
			Mouse: 
			${e.latlng.lat.toFixed(2)}
			${e.latlng.lng.toFixed(2)}
			`;
		});
		return container;
	}
	});
	map.addControl(new Coordinates({ position: "bottomleft" }));
	
    pop.eachLayer(function (layer) {
        constructor(pop, layer)
    });
    hiphop.eachLayer(function (layer) {

    house.eachLayer(function (layer) {

    });

    if (genreALLOW["funk"] == true) {

    var clickedCoords = document.getElementById("clicked_coords")
    map.on("click", function (e) {
        if (pathmakerActive == true) {
            var comma = ""
            if (clickedCoords.innerHTML != "") {
                comma = ","
            }
            var lat = Math.round(e.latlng.lat * 100)/100
            var lng = Math.round(e.latlng.lng * 100)/100
            // console.log(e.latlng.lng)
            clickedCoords.innerHTML += comma + "[" + lng + ", " + lat + "]"
        }
    })
